<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiftIQ — Gym Tuning Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4 font-sans antialiased">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header & Connection Status -->
    <header class="flex items-center justify-between bg-gray-800 p-4 rounded-xl border border-gray-700">
      <div>
        <h1 class="text-xl font-bold tracking-tight">LiftIQ Tuner</h1>
        <p id="statusText" class="text-xs text-yellow-400 font-medium">Disconnected</p>
      </div>
      <button id="connectBtn" onclick="toggleConnect()" class="bg-blue-600 hover:bg-blue-500 text-sm font-semibold px-4 py-2 rounded-lg transition">
        Connect
      </button>
    </header>

    <!-- Set Controls & Live Rep Summary -->
    <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-sm font-medium text-gray-400">Active Session</span>
        <button onclick="startSet()" class="bg-green-600 hover:bg-green-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition">
          ▶ Start New Set
        </button>
      </div>
      <div class="text-center py-2">
        <span class="text-xs text-gray-400 uppercase tracking-wider">Completed Reps</span>
        <div id="repCountDisplay" class="text-6xl font-extrabold text-blue-400 my-1">0</div>
      </div>
    </div>

    <!-- Live Telemetry Log Table -->
    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
      <h2 class="text-sm font-bold text-gray-300 mb-3">Rep History Log</h2>
      <div class="max-h-56 overflow-y-auto">
        <table class="w-full text-left text-xs text-gray-300">
          <thead class="text-gray-500 uppercase border-b border-gray-700">
            <tr>
              <th class="pb-2">Rep</th>
              <th class="pb-2">Mean Vel</th>
              <th class="pb-2">Peak Vel</th>
              <th class="pb-2">Peak Accel</th>
            </tr>
          </thead>
          <tbody id="repLogTable" class="divide-y divide-gray-700/50">
            <tr>
              <td colspan="4" class="py-4 text-center text-gray-500 italic">No reps logged yet. Connect and start lifting.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Real-time Parameter Adjustment Sliders -->
    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-4">
      <h2 class="text-sm font-bold text-gray-300">On-the-Fly Threshold Tuning</h2>
      
      <!-- Start Accel Threshold -->
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span class="text-gray-400">Start Accel Threshold</span>
          <span id="startThreshVal" class="font-mono text-blue-400">1.2 m/s²</span>
        </div>
        <input type="range" id="startThresh" min="0.5" max="3.0" step="0.1" value="1.2" oninput="updateParamsUI()" class="w-full">
      </div>

      <!-- Min Concentric Time -->
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span class="text-gray-400">Min Concentric Duration</span>
          <span id="minDurVal" class="font-mono text-blue-400">400 ms</span>
        </div>
        <input type="range" id="minDur" min="100" max="1000" step="50" value="400" oninput="updateParamsUI()" class="w-full">
      </div>

      <!-- Min Peak Velocity -->
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span class="text-gray-400">Min Peak Velocity</span>
          <span id="minVelVal" class="font-mono text-blue-400">0.12 m/s</span>
        </div>
        <input type="range" id="minVel" min="0.05" max="0.50" step="0.01" value="0.12" oninput="updateParamsUI()" class="w-full">
      </div>

      <button onclick="sendParamsToESP()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold text-xs py-2 rounded-lg transition">
        Sync Parameters to Sensor
      </button>
    </div>

  </div>

  <script>
    const SERVICE_UUID = "4fa8691a-1365-4a4f-a808-3fda13b292e0";
    const NOTIFY_UUID  = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    const WRITE_UUID   = "cba8691a-1365-4a4f-a808-3fda13b292e0";

    let bleDevice, notifyChar, writeChar;

    async function toggleConnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return;
      }

      try {
        document.getElementById("statusText").innerText = "Connecting...";
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'GymIQ Sensor' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        notifyChar = await service.getCharacteristic(NOTIFY_UUID);
        writeChar  = await service.getCharacteristic(WRITE_UUID);

        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', handleMetricNotification);

        document.getElementById("statusText").innerText = "Connected";
        document.getElementById("statusText").className = "text-xs text-green-400 font-medium";
        document.getElementById("connectBtn").innerText = "Disconnect";
        document.getElementById("connectBtn").className = "bg-red-600 hover:bg-red-500 text-sm font-semibold px-4 py-2 rounded-lg transition";
      } catch (err) {
        console.error(err);
        document.getElementById("statusText").innerText = "Connection Failed";
        document.getElementById("statusText").className = "text-xs text-red-400 font-medium";
      }
    }

    function onDisconnected() {
      document.getElementById("statusText").innerText = "Disconnected";
      document.getElementById("statusText").className = "text-xs text-yellow-400 font-medium";
      document.getElementById("connectBtn").innerText = "Connect";
      document.getElementById("connectBtn").className = "bg-blue-600 hover:bg-blue-500 text-sm font-semibold px-4 py-2 rounded-lg transition";
    }

    function handleMetricNotification(event) {
      const data = event.target.value;
      const reps = data.getUint8(0);
      const meanVel = (data.getUint8(1) / 100.0).toFixed(2);
      const peakVel = (data.getUint8(2) / 100.0).toFixed(2);
      const peakAccel = (data.getUint8(3) / 10.0).toFixed(1);

      document.getElementById("repCountDisplay").innerText = reps;

      const table = document.getElementById("repLogTable");
      if (reps === 1) table.innerHTML = ""; // Clear placeholder on first rep

      const row = `<tr class="border-b border-gray-700/50">
        <td class="py-2 font-bold text-blue-400">#${reps}</td>
        <td class="py-2">${meanVel} m/s</td>
        <td class="py-2">${peakVel} m/s</td>
        <td class="py-2">${peakAccel} m/s²</td>
      </tr>`;
      
      table.innerHTML = row + table.innerHTML;
    }

    async function startSet() {
      if (!writeChar) return;
      document.getElementById("repCountDisplay").innerText = "0";
      document.getElementById("repLogTable").innerHTML = `<tr><td colspan="4" class="py-4 text-center text-gray-500 italic">Set initialized...</td></tr>`;
      
      // Send Command 0x01 (Start Set)
      const payload = new Uint8Array([0x01]);
      await writeChar.writeValue(payload);
    }

    function updateParamsUI() {
      document.getElementById("startThreshVal").innerText = document.getElementById("startThresh").value + " m/s²";
      document.getElementById("minDurVal").innerText = document.getElementById("minDur").value + " ms";
      document.getElementById("minVelVal").innerText = document.getElementById("minVel").value + " m/s";
    }

    async function sendParamsToESP() {
      if (!writeChar) return;
      const startThresh = Math.round(parseFloat(document.getElementById("startThresh").value) * 10);
      const minDur = Math.round(parseInt(document.getElementById("minDur").value) / 10);
      const minVel = Math.round(parseFloat(document.getElementById("minVel").value) * 100);

      // Send Command 0x02 + parameters
      const payload = new Uint8Array([0x02, startThresh, minDur, minVel]);
      await writeChar.writeValue(payload);
      alert("Parameters updated on sensor!");
    }
  </script>
</body>
</html>
